<!DOCTYPE html>
<html>

<head>

<title>EventEase - My events</title>
<link rel="icon" type="image/png" href="../logo.png">
<style>

  /* day/night mode */

      :root{

    --bg:#f4f7fc;

    --navbar:white;

    --card:white;

    --text:#333;

    --secondaryText:gray;

    --shadow:0 5px 15px rgba(0,0,0,0.08);
      }

    .dark-mode{

    --bg:#0f172a;

    --navbar:#1e293b;

    --card:#334155;

    --text:#f8fafc;

    --secondaryText:#cbd5e1;

    --shadow:0 5px 20px rgba(0,0,0,0.4);

    }

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
    padding:40px;
}

 nav {
            width: 100%;
            border-radius: 8px;
            background:var(--navbar);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;

        }

        nav .logo {
            display: flex;
            align-items: center;
        }

        nav .theme-btn {
           background: transparent;
          border: 1px solid var(--border);
          padding: 5px 12px;
          border-radius: 20px;
          cursor: pointer;
          /* font-size: 1.2rem; */
          transition: all 0.3s ease;
          color: var(--text);
          border: 1px solid grey;
        }

        nav .theme-btn:hover {
            background-color: var(--bg);
        }
        

h1{
    margin-bottom:30px;
}
#updateBtn{
    margin-bottom:20px;
    padding:12px 25px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-weight:bold;
}
    
#goToDash{
    margin-bottom:20px;
    padding:12px 25px;
    border:none;
    border-radius:8px;
    background:#092e5f;
    color:white;
    cursor:pointer;
    font-weight:bold;
}
    #crtMreEvent{
    margin-bottom:20px;
    padding:12px 25px;
    border:none;
    border-radius:8px;
    background:#092e5f;
    color:white;
    cursor:pointer;
    font-weight:bold;
}
#eventsContainer{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.event-card{
    background:var(--card);
    padding:20px;
    border-radius:15px;
    box-shadow:
    0 5px 15px rgba(0,0,0,0.1);
}

.event-card p{
    margin:8px 0;
}
    
.deleteBtn{
    margin-top:15px;
    padding:10px 15px;
    border:none;
    background:red;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

.AIbutton{
    margin-top:15px;
    margin-left: 40px;
    padding:10px 15px;
    border:none;
    background:rgb(22, 151, 194);
    color:white;
    border-radius:8px;
    cursor:pointer;
}

</style>

</head>

<body>
    <nav>
        <div class="logo"><!-- EventEase Logo Start -->
<div class="eventease-glowing-logo">
    
    <!-- SVG Symbol -->
    <!-- TO CHANGE SYMBOL SIZE: Adjust 'width' and 'height' values below. (Do not change the viewBox) -->
    <svg class="logo-symbol" viewBox="0 0 100 64" width="75" height="48" xmlns="http://www.w3.org/2000/svg">
        <!-- Left Dark Circle -->
        <circle cx="34" cy="32" r="20" stroke="grey" stroke-width="13" fill="none" />
        <!-- Right Cyan Circle -->
        <circle cx="64" cy="32" r="20" stroke="#00E5FF" stroke-width="13" fill="none" />
        <!-- Center Overlap Lens (Blue) -->
        <path d="M 49 15 Q 38 32 49 49 Q 60 32 49 15 Z" fill="#0088FF" />
    </svg>

    <!-- Logo Text -->
    <div class="logo-text">
        <span class="text-event">Event</span><span class="text-ease">Ease</span>
    </div>

    <!-- Inline CSS for Styling and Glow Effects -->
    <style>
        .eventease-glowing-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            
            /* TO CHANGE SPACING BETWEEN SYMBOL AND TEXT: Adjust the 'gap' value below */
            gap: 6px; 
            
            /* TO CHANGE BORDER SIZE AROUND THE LOGO: Adjust the 'padding' below (top, right, bottom, left) */
            padding: 8px 24px 8px 16px; 
            
            background-color: transparent;
            
            /* 1px Glowing Border */
            border: 0.05px solid #00E5FF;
            border-radius: 50px;
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.6), 
                        inset 0 0 12px rgba(0, 229, 255, 0.3);
            
            /* Ensures it scales to fit content */
            width: max-content;
            font-family: 'Segoe UI', 'Montserrat', system-ui, sans-serif;
            user-select: none;
        }

        /* Subtle glow on the SVG symbol */
        .logo-symbol {
            filter: drop-shadow(0 0 6px rgba(0, 229, 255, 0.4));
        }

        .logo-text {
            /* TO CHANGE TEXT SIZE: Adjust the 'font-size' value below */
            font-size: 28px; 
            
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1;
        }

        .text-event {
            color: #7dece7;
            /* Subtle glow for the dark text to ensure it stands out */
        }

        .text-ease {
            color: #0088FF;
            /* Bright blue glow for the second half of the text */
        }
    </style>
</div>
<!-- EventEase Logo End --></div>
        <button class="theme-btn" id="themeToggle">🌙</button>
    </nav>

<h1>My Events</h1>
    <button id="updateBtn">
    Update Changes
</button>

    <button id="goToDash">
    Go to Dashboard
</button>
    <button id="crtMreEvent">
   Create more Events
</button>

<div id="eventsContainer"></div>

<script type="module"
src="my_events.js">
</script>

</body>

</html>
