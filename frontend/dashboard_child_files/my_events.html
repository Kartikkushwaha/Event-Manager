<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- CRITICAL FOR PROPER MOBILE SCALING -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventEase - My Events</title>
    <link rel="icon" type="image/png" href="../logo.png">
    
    <!-- Inherits standard layout from dashboard.css -->
    <link rel="stylesheet" href="../dashboard.css">
    
    <style>
        /* --- Page Layout & Typography --- */
        .page-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 24px;
            width: 100%;
        }

        h1 {
            text-align: left; /* Left Aligned Professional Heading */
            margin-bottom: 30px;
            color: var(--text-main);
            font-size: 2.2rem;
        }

        /* --- Desktop Layout: Vertical Stack --- */
        .layout-wrapper {
            display: flex;
            flex-direction: column;
            gap: 24px;
            position: relative;
        }

        /* --- Action Sidebar (Desktop default: horizontal row) --- */
        .action-sidebar {
            display: flex;
            flex-direction: row;
            align-items: center;
        }

        .sidebar-toggle {
            display: none; /* Hidden on desktop */
        }

        .sidebar-buttons {
            display: flex;
            flex-direction: row;
            gap: 16px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: var(--primary-color);
            color: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: transform 0.2s, background 0.2s;
            display: flex;
            align-items: center;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            background: #1d4ed8;
        }

        #goToDash, #crtMreEvent { background: #0f172a; }
        #goToDash:hover, #crtMreEvent:hover { background: #1e293b; }

        .btn-icon {
            display: none; /* Hide the single letters on desktop */
        }

        .btn-text {
            display: block;
        }

        /* --- Grid & Event Cards --- */
        #eventsContainer {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
            width: 100%;
        }

        .event-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            text-align: left; /* STRICTLY LEFT ALIGNED */
        }

        .event-card:hover { transform: translateY(-4px); }
        .event-card h2 { color: var(--primary-color); margin-bottom: 12px; font-size: 1.5em; text-align: left; }
        .event-card p { margin: 6px 0; color: var(--text-main); font-size: 0.95em; }

        .card-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            margin-top: auto; 
        }

        .deleteBtn {
            padding: 10px 16px; border: none; background: #ef4444; color: white;
            border-radius: 8px; cursor: pointer; font-weight: 600; flex: 1; transition: background 0.2s;
        }
        .deleteBtn:hover { background: #dc2626; }

        .AIbutton {
            padding: 10px 16px; border: none; background: #0ea5e9; color: white;
            border-radius: 8px; cursor: pointer; font-weight: 600; flex: 1; transition: background 0.2s;
        }
        .AIbutton:hover { background: #0284c7; }

        /* =========================================================
           MOBILE SPECIFIC: EXPANDABLE LEFT SIDEBAR
        ========================================================= */
        @media (max-width: 768px) {
            .page-container {
                padding: 10px 16px;
            }

            .layout-wrapper {
                flex-direction: row; 
                align-items: flex-start;
                gap: 12px;
            }

            /* The Collapsed Left Bar */
            .action-sidebar {
                flex-direction: column;
                position: sticky;
                top: 90px; /* Sticks below the navbar while scrolling */
                width: 44px; /* Fixed narrow width for U, D, E */
                background: var(--card-bg);
                border: 1px solid var(--border-color);
                border-radius: 12px;
                box-shadow: var(--shadow);
                transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                overflow: hidden;
                z-index: 50;
                flex-shrink: 0;
            }

            /* >> Toggle Button */
            .sidebar-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 100%;
                height: 44px;
                background: transparent;
                border: none;
                border-bottom: 1px solid var(--border-color);
                color: var(--text-main);
                font-size: 20px;
                font-weight: bold;
                cursor: pointer;
                transition: background 0.2s;
            }

            .sidebar-toggle:hover {
                background: var(--surface-secondary);
            }

            .sidebar-toggle span {
                transition: transform 0.3s ease;
                display: inline-block;
            }

            .sidebar-buttons {
                flex-direction: column;
                gap: 0;
                width: 100%;
            }

            /* Style the U, D, E buttons to look like tabs */
            .action-btn {
                width: 100%;
                padding: 16px 0;
                border-radius: 0;
                background: transparent !important;
                color: var(--text-main) !important;
                justify-content: flex-start;
                border-bottom: 1px solid var(--border-color);
                transition: background 0.2s;
            }

            .action-btn:last-child {
                border-bottom: none;
            }

            .action-btn:hover {
                background: var(--surface-secondary) !important;
                transform: none;
            }

            /* Format the U, D, E letters */
            .btn-icon {
                display: inline-block;
                font-size: 16px;
                font-weight: 800;
                width: 44px; /* Aligns exactly in the collapsed width */
                text-align: center;
                color: var(--primary-color);
                flex-shrink: 0;
            }

            /* Hide full text until expanded */
            .btn-text {
                display: inline-block;
                opacity: 0;
                margin-left: 4px;
                transition: opacity 0.2s ease;
                white-space: nowrap;
                pointer-events: none; 
            }

            /* --- Expanded State --- */
            .action-sidebar.expanded {
                width: 50vw; /* Expands to half screen */
            }

            .action-sidebar.expanded .sidebar-toggle span {
                transform: rotate(180deg); /* Flip >> to << */
            }

            .action-sidebar.expanded .btn-text {
                opacity: 1;
                pointer-events: auto;
            }

            /* Event cards take up the rest of the screen on the right */
            #eventsContainer {
                flex: 1;
                grid-template-columns: 1fr; /* Stacks cards in one column */
                min-width: 0; /* Prevents flex overflow */
            }

            .card-buttons {
                flex-direction: column; 
            }
        }
    </style>
</head>
<body>

    <!-- Unified Navbar (No Links, No Hamburger since this is a dedicated dashboard view) -->
    <header class="header-wrapper">
        <nav class="navbar">
            <div class="logo">
                <svg class="nav-logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80">
                  <g transform="translate(25, 22)">
                    <rect x="0" y="0" width="32" height="8" rx="4" style="fill: var(--text-primary); transition: fill 0.3s ease;"/>
                    <rect x="0" y="14" width="20" height="8" rx="4" style="fill: var(--text-secondary); transition: fill 0.3s ease;"/>
                    <rect x="0" y="28" width="32" height="8" rx="4" style="fill: var(--text-tertiary); transition: fill 0.3s ease;"/>
                  </g>
                  <text x="75" y="52" font-family="'Product Sans', Arial, sans-serif" font-size="32" font-weight="bold" style="fill: var(--text-primary); transition: fill 0.3s ease;" letter-spacing="-0.5">EventEase</text>
                </svg>
            </div>
            
            <div class="nav-controls">
                <button id="themeToggle" class="theme-btn" aria-label="Toggle Theme">🌙</button>
            </div>
        </nav>
    </header>

    <div class="page-container">
        <h1>My Events</h1>
        
        <!-- Adaptive Layout Wrapper -->
        <div class="layout-wrapper">
            
            <!-- Dynamic Action Bar (Left column on mobile, Top row on desktop) -->
            <div class="action-sidebar" id="actionSidebar">
                
                <!-- Toggle Button (Only visible on mobile) -->
                <button class="sidebar-toggle" id="sidebarToggle">
                    <span>&raquo;</span>
                </button>
                
                <div class="sidebar-buttons">
                    <button id="updateBtn" class="action-btn">
                        <span class="btn-icon">U</span>
                        <span class="btn-text">Update Changes</span>
                    </button>
                    <button id="goToDash" class="action-btn">
                        <span class="btn-icon">D</span>
                        <span class="btn-text">Go to Dashboard</span>
                    </button>
                    <button id="crtMreEvent" class="action-btn">
                        <span class="btn-icon">E</span>
                        <span class="btn-text">Create more Events</span>
                    </button>
                </div>
            </div>

            <!-- The grid where events will be rendered -->
            <div id="eventsContainer"></div>

        </div>
    </div>

    <script type="module" src="my_events.js"></script>
</body>
</html>
