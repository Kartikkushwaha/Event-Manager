<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventEase - AI-Powered Creator</title>
    <link rel="icon" type="image/png" href="../../../../logo.png">
    <link rel="stylesheet" href="AI_inv_gen.css">
    
    <!-- Lucide Icons Script -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <!-- Floating Top Navbar (Taller, 1-Line, Centered) -->
  <header class="navbar-wrapper">
    <nav class="navbar">
      
      <!-- Logo Pillar (Left) -->
      <div class="logo">
          <!-- Dynamic Massive Logo configured for theme variables -->
          <svg class="nav-logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80">
            <g transform="translate(25, 22)">
              <rect x="0" y="0" width="32" height="8" rx="4" style="fill: var(--text-main); transition: fill 0.3s ease;"/>
              <rect x="0" y="14" width="20" height="8" rx="4" style="fill: var(--text-muted); transition: fill 0.3s ease;"/>
              <rect x="0" y="28" width="32" height="8" rx="4" style="fill: var(--text-muted); transition: fill 0.3s ease;"/>
            </g>
            <text x="75" y="52" font-family="'Product Sans', Arial, sans-serif" font-size="32" font-weight="bold" style="fill: var(--text-main); transition: fill 0.3s ease;" letter-spacing="-0.5">EventEase</text>
          </svg>
      </div>

      <!-- Links Pillar (Center) -->
      <ul class="nav-links" id="navLinks">
        <li><a href="../../../../dashboard.html" class="nav-link">Dashboard</a></li>
        <li><a href="../../../AI_plan.html" class="nav-link">AI Panel</a></li>
        <li><a href="#" class="nav-link active">AI Invitation Generator</a></li>
      </ul>

      <!-- Controls Pillar (Right) -->
      <div class="nav-controls">
          <button id="themeToggle" class="theme-btn" aria-label="Toggle Theme">
            <span id="themeIcon">☀️</span>
          </button>
          <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menu">
              <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="3" y1="12" x2="21" y2="12"></line>
                  <line x1="3" y1="6" x2="21" y2="6"></line>
                  <line x1="3" y1="18" x2="21" y2="18"></line>
              </svg>
          </button>
      </div>
    </nav>
  </header>

  <main class="container">
    <!-- Left Panel: Input & Controls -->
    <div class="controls">
      <h1>AI Invitation Generator</h1>
      <p class="subtitle">Describe your event to generate a downloadable high-quality invitation card.</p>
      
      <div class="input-group">
        <label for="promptInput">
          <b>Please describe your invitation Card</b>
          <span class="note">Note: This generator is fully AI-based; specify colors, names, and themes for best results.</span>
        </label>
        <textarea id="promptInput" placeholder="Create a royal wedding invitation card with heading 'Welcome to our Wedding', gold accents, and names John and Jane..."></textarea>
      </div>
      
      <!-- Updated button with Icon & Text spans -->
      <button id="generateBtn" class="btn-main">
        <span class="btn-icon"><i data-lucide="sparkles"></i></span>
        <span class="btn-text">Generate My Invitation</span>
      </button>
      <div id="statusText" class="status"></div>
    </div>

    <!-- Right Panel: Preview & Download -->
    <div class="preview-area">
      <div id="actionBar" class="action-bar">
        <!-- Updated button with Icon & Text spans -->
        <a id="downloadBtn" class="btn-download" download="invitation_card.png">
          <span class="btn-icon"><i data-lucide="arrow-down-to-line"></i></span>
          <span class="btn-text">Download Invitation Card</span>
        </a>
      </div>

      <div class="invitation-card">
        <div id="placeholderText" class="placeholder-text">
          <span class="placeholder-icon">🎨</span>
          <p>Your generated invitation card will appear here...</p>
        </div>
        <img id="imagePreview" alt="Generated Invitation Card" />
      </div>
    </div>
  </main>

  <!-- Hidden HTML5 Canvas used for off-screen PNG rendering -->
  <canvas id="hiddenCanvas" width="800" height="1100"></canvas>
  
  <script type="module" src="AI_inv_gen.js"></script>

  <!-- Initialize Lucide Icons -->
  <script>
      lucide.createIcons();
  </script>

</body>
</html>
