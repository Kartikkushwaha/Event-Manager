<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventEase - Guest List Manager</title>
    <link rel="icon" type="image/png" href="../../logo.png">
<style>
  :root {
    --bg: #f8fafc;
    --navbar: rgba(255, 255, 255, 0.85);
    --card: #ffffff;
    --text: #0f172a;
    --secondaryText: #64748b;
    --border: #e2e8f0;
    --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.03);
    --accent: #2563eb;
    --bgCore: #f8fafc;
  }

  .dark-mode {
    --bg: #0b0f19;
    --navbar: rgba(30, 41, 59, 0.8);
    --card: #1e293b;
    --text: #f8fafc;
    --secondaryText: #94a3b8;
    --border: #334155;
    --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
    --accent: #3b82f6;
    --bgCore: #0b0f19;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background: var(--bg);
    color: var(--text);
    transition: background-color 0.3s ease, color 0.3s ease;
    min-height: 100vh;
  }

  /* Navbar */
  .navbar {
    background: var(--navbar);
    padding: 16px 36px;
    display: flex;
    border-radius: 16px; 
    justify-content: space-between;
    align-items: center;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    position: sticky;
    top: 15px;
    z-index: 100;
    margin: 15px 20px 0 20px;
  }

  .logo {
    display: flex;
    align-items: center;
  }



  .nav-links {
    display: flex;
    gap: 28px;
    align-items: center;
  }

  .nav-links a {
    text-decoration: none;
    color: var(--secondaryText);
    font-weight: 500;
    font-size: 15px;
    transition: color 0.2s ease;
  }

  .nav-links a:hover {
    color: var(--accent);
  }

  /* theme button toggle */
  #themeToggle {
    background: transparent;
    border: 1px solid var(--border);
    padding: 5px 12px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.3s ease;
    color: var(--text);
  }

  #themeToggle:hover {
    background-color: var(--bg);
    transform: scale(1.02);
  }

  /* Guest Panel */
  .guest-panel {
    width: 92%;
    max-width: 1200px;
    margin: 30px auto;
    background: var(--card);
    padding: 28px;
    border-radius: 20px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    transition: background-color 0.3s ease, border-color 0.3s ease;
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 16px;
  }

  .panel-header h2 {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
  }

  /* Top Stat Bar & Controls */
  .guest-stats-bar {
    background: rgba(37, 99, 235, 0.08);
    border: 1px solid rgba(37, 99, 235, 0.2);
    padding: 12px 18px;
    border-radius: 12px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    font-weight: 600;
    color: var(--accent);
    font-size: 15px;
  }

  /* Sort Dropdown Styling */
  .sort-container {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--text);
  }

  .sort-dropdown {
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    outline: none;
    transition: all 0.2s ease;
  }

  .sort-dropdown:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  /* Refined Button Hierarchy */
  .panel-buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .panel-buttons button {
    padding: 10px 16px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  #addGuestBtn, #saveGuestBtn {
    background: var(--accent);
    color: white;
    border: 1px solid transparent;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
  }

  #addGuestBtn:hover, #saveGuestBtn:hover {
    background: #1d4ed8;
    transform: translateY(-1px);
  }

  #ExportGuestBtn {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }

  #ExportGuestBtn:hover {
    background: rgba(148, 163, 184, 0.1);
  }

  #RemoveGuestBtn {
    background: rgba(239, 68, 68, 0.1);
    color: #ef4444;
    border: 1px solid transparent;
  }

  #RemoveGuestBtn:hover {
    background: #ef4444;
    color: white;
  }

  /* Grid Layouts */
  .guest-head, .guest-row {
    display: grid;
    grid-template-columns: 50px minmax(160px, 1.5fr) minmax(160px, 1.5fr) minmax(130px, 1fr) 44px;
    gap: 14px;
    align-items: center;
  }

  .guest-head {
    font-weight: 600;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--secondaryText);
    padding: 0 10px 12px 10px;
    border-bottom: 1px solid var(--border);
  }

  .guest-row {
    margin: 12px 0;
    padding: 6px 10px;
    border-radius: 12px;
    transition: background-color 0.2s ease;
  }

  .guest-row:hover {
    background: rgba(148, 163, 184, 0.05);
  }

  /* Modern Input Fields */
  .guest-row input {
    width: 100%;
    min-width: 0;
    padding: 10px 14px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 10px;
    font-size: 14px;
    transition: all 0.2s ease;
  }

  .guest-row input:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--card);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  .serial-box {
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    color: var(--secondaryText);
    font-size: 14px;
  }

  .deleteBtn {
    background: transparent;
    color: #ef4444;
    width: 40px;
    height: 40px;
    border: 1px solid transparent;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }

  .deleteBtn:hover {
    background: rgba(239, 68, 68, 0.1);
    transform: scale(1.05);
  }

  /* Mobile Responsive Adaptations */
  @media (max-width: 900px) {
    .guest-head {
      display: none;
    }

    .guest-row {
      grid-template-columns: 1fr;
      gap: 12px;
      padding: 18px;
      border: 1px solid var(--border);
      background: var(--bg);
      margin-bottom: 16px;
      position: relative;
    }

    .guest-row:hover {
      background: var(--bg);
    }

    .serial-box {
      justify-content: flex-start;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
      color: var(--accent);
    }

    .serial-box::before {
      content: "Guest #";
    }

    .deleteBtn {
      width: 100%;
      height: 42px;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      margin-top: 6px;
    }

    .deleteBtn::after {
      font-size: 14px;
      font-weight: 600;
      margin-left: 6px;
    }
  }

  @media (max-width: 640px) {
    .navbar {
      margin: 10px 10px 0 10px;
      padding: 14px 20px;
      flex-direction: column;
      gap: 16px;
    }

    .nav-links {
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    #themeToggle {
      margin-right: 0;
      width: 100%;
    }

    .guest-panel {
      width: 94%;
      padding: 18px;
      margin: 20px auto;
    }

    .panel-header {
      flex-direction: column;
      align-items: flex-start;
    }

    .guest-stats-bar {
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
    }

    .sort-container {
      width: 100%;
      justify-content: space-between;
    }

    .sort-dropdown {
      flex-grow: 1;
    }

    .panel-buttons {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .panel-buttons button {
      width: 100%;
    }
  }
</style>
</head>
