<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventEase - Create Event</title>
    <link rel="icon" type="image/png" href="../logo.png">
    
    <!-- Link to your main dashboard.css to inherit all the navbar/theme fixes -->
    <link rel="stylesheet" href="../dashboard.css">
    
    <style>
      /* --- Form Specific Styles (Inherits colors from dashboard.css) --- */
      .header-section {
          text-align: center;
          margin: 30px 20px 10px;
      }
      
      #welcome {
          font-size: 2.2rem;
          font-weight: 800;
          color: var(--text-main);
          letter-spacing: -1px;
      }
      
      #crtyrevent {
          font-size: 1rem;
          color: var(--text-sub);
          margin-top: 5px;
      }

      .form-container {
          background: var(--card-bg);
          color: var(--text-main);
          width: 95%;
          max-width: 900px;
          margin: 20px auto 60px;
          padding: 40px;
          border-radius: var(--radius-lg);
          box-shadow: var(--shadow);
          border: 1px solid var(--border-color);
          display: flex;
          flex-direction: column;
          gap: 25px;
          transition: background-color 0.3s, border-color 0.3s, box-shadow 0.3s;
      }

      .form-group {
          display: flex;
          flex-direction: column;
          gap: 8px;
      }
      .form-group h3, .form-group label {
          font-size: 0.95rem;
          color: var(--text-main);
          font-weight: 600;
      }

      select, input[type="text"], input[type="number"], input[type="datetime-local"] {
          width: 100%;
          padding: 12px 16px;
          border: 1px solid var(--border-color);
          border-radius: 8px;
          background-color: transparent;
          font-size: 0.95rem;
          color: grey;
          outline: none;
          transition: border-color 0.2s, box-shadow 0.2s;
      }
      
      select:focus, input:focus {
          border-color: var(--primary-color);
          box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }
      
      .dropdown-grid {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 20px;
      }

      .button-wrapper {
          display: flex;
          justify-content: flex-end;
          margin-top: 15px;
      }
      
      .save-btn {
          background-color: var(--primary-color);
          color: white;
          border: none;
          padding: 14px 36px;
          font-size: 1rem;
          font-weight: 600;
          border-radius: 8px;
          cursor: pointer;
          transition: background-color 0.2s, transform 0.1s;
      }
      
      .save-btn:hover {
          background-color: #1d4ed8;
      }
      
      .save-btn:active {
          transform: scale(0.98);
      }

      @media (max-width: 992px) {
          .dropdown-grid {
              grid-template-columns: repeat(2, 1fr);
          }
      }
      
      @media (max-width: 600px) {
          .dropdown-grid {
              grid-template-columns: 1fr;
          }
          .form-container {
              padding: 25px 20px;
          }
          .button-wrapper {
              justify-content: stretch;
          }
          .save-btn {
              width: 100%;
          }
      }
    </style>
</head>
<body>

    <!-- Unified Floating Glass Navbar -->
    <header class="header-wrapper">
        <nav class="navbar">
            <!-- Dynamic Massive Logo -->
            <div class="logo">
                <svg class="nav-logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80">
                  <g transform="translate(25, 22)">
                    <rect x="0" y="0" width="32" height="8" rx="4" style="fill: var(--text-primary); transition: fill 0.3s ease;"/>
                    <rect x="0" y="14" width="20" height="8" rx="4" style="fill: var(--text-secondary); transition: fill 0.3s ease;"/>
                    <rect x="0" y="28" width="32" height="8" rx="4" style="fill: var(--text-tertiary); transition: fill 0.3s ease;"/>
                  </g>
                  <text x="75" y="52" font-family="'Product Sans', Arial, sans-serif" font-size="32" font-weight="bold" style="fill: var(--text-primary); transition: fill 0.3s ease;" letter-spacing="-0.5">EventEase</text>
                </svg>
            </div>
            
            <!-- Nav Links without the pill background -->
            <div class="nav-links" id="navLinks">
                <!-- Using ../ to go back to main folder where dashboard.html is -->
                <a id="dashboard-link" href="../dashboard.html">Dashboard</a>
                <a id="myevents-link" href="my_events.html">My Events</a>
            </div>
            
            <!-- Right-Side Controls -->
            <div class="nav-controls">
                <button id="themeToggle" class="theme-btn" aria-label="Toggle Theme">🌙</button>
                <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menu">
                    <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
            </div>
        </nav>
    </header>
    
    <!-- Welcome Text -->
    <div class="header-section">
        <div id="welcome">Welcome!</div>
        <div id="crtyrevent">Create your Event seamlessly.</div>
    </div>

    <!-- The Form -->
    <div class="form-container">
        <div class="form-group">
            <h3>Name of the Event:</h3>
            <input id="name" type="text" placeholder="Ex: Wedding Celebration">
        </div>

        <div class="form-group" id="specialPersonGroup" style="display: none;">
            <h3>Special person/Couples:</h3>
            <input id="specialPerson" type="text" placeholder="Enter Name(s) (e.g. John & Jane)">
        </div>

        <div class="dropdown-grid">
            <div class="form-group">
                <label>Choose the Type of Event</label>
                <select id="eventType" name="event-type">
                    <option value="" disabled selected>Select type...</option>
                    <option value="traditional">Traditional</option>
                    <option value="modern">Modern</option>
                    <option value="custom">Custom</option>
                </select>
            </div>

            <div class="form-group">
                <label>Choose the Religion</label>
                <select id="relchose" name="rel-type">
                    <option value="" disabled selected>Select religion...</option>
                    <option value="hinduism">Hinduism</option>
                    <option value="islam">Islam</option>
                    <option value="christianity">Christianity</option>
                    <option value="sikhism">Sikhism</option>
                    <option value="buddhism">Buddhism</option>
                    <option value="others">Others</option>
                    <option value="none">No choice required</option>
                </select>
            </div>

            <div class="form-group">
                <label>Choose State/Residence (India)</label>
                <select id="state" name="state-residence">
                    <option value="" disabled selected>Select state/UT...</option>
                    <optgroup label="States">
                        <option value="ap">Andhra Pradesh</option>
                        <option value="ar">Arunachal Pradesh</option>
                        <option value="as">Assam</option>
                        <option value="br">Bihar</option>
                        <option value="ct">Chhattisgarh</option>
                        <option value="ga">Goa</option>
                        <option value="gj">Gujarat</option>
                        <option value="hr">Haryana</option>
                        <option value="hp">Himachal Pradesh</option>
                        <option value="jh">Jharkhand</option>
                        <option value="ka">Karnataka</option>
                        <option value="kl">Kerala</option>
                        <option value="mp">Madhya Pradesh</option>
                        <option value="mh">Maharashtra</option>
                        <option value="mn">Manipur</option>
                        <option value="ml">Meghalaya</option>
                        <option value="mz">Mizoram</option>
                        <option value="nl">Nagaland</option>
                        <option value="or">Odisha</option>
                        <option value="pb">Punjab</option>
                        <option value="rj">Rajasthan</option>
                        <option value="sk">Sikkim</option>
                        <option value="tn">Tamil Nadu</option>
                        <option value="tg">Telangana</option>
                        <option value="tr">Tripura</option>
                        <option value="up">Uttar Pradesh</option>
                        <option value="ut">Uttarakhand</option>
                        <option value="wb">West Bengal</option>
                    </optgroup>
                    <optgroup label="Union Territories">
                        <option value="an">Andaman and Nicobar Islands</option>
                        <option value="ch">Chandigarh</option>
                        <option value="dh">Dadra and Nagar Haveli and Daman and Diu</option>
                        <option value="dl">Delhi</option>
                        <option value="jk">Jammu and Kashmir</option>
                        <option value="la">Ladakh</option>
                        <option value="ld">Lakshadweep</option>
                        <option value="py">Puducherry</option>
                    </optgroup>
                </select>
            </div>

            <div class="form-group">
                <label>Choose the Events</label>
                <select id="eventCategory" name="specific-event">
                    <option value="" disabled selected>Select category...</option>
                    <option value="wedding">Wedding</option>
                    <option value="birthday">Birthday</option>
                    <option value="baby_shower">Baby shower</option>
                    <option value="corporate">Corporate</option>
                    <option value="farewell">Farewell</option>
                    <option value="college_fest">College Fest</option>
                    <option value="anniversary">Anniversary</option>
                    <option value="valentine">Valentine</option>
                    <option value="custom">Custom</option>
                </select>
            </div>

            <div class="form-group">
                <label>Number of Invitations</label>
                <select id="guestCount" name="invitation-count">
                    <option value="" disabled selected>Select count...</option>
                    <option value="1-50">1 - 50</option>
                    <option value="51-200">51 - 200</option>
                    <option value="201-500">201 - 500</option>
                    <option value="500-1000">500 - 1000</option>
                    <option value="1000-2000">1000 - 2000</option>
                    <option value="custom">Custom</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Choose Date & Time</label>
                <input type="datetime-local" id="date_time">
            </div>
        </div>

        <div class="form-group">
            <h3>Budget of the Event</h3>
            <input id="budget" type="number" placeholder="Enter Amount (INR)">
        </div>

        <div class="button-wrapper">
            <button id="saveBtn" type="button" class="save-btn">Save Event</button>
        </div>

    </div>
    
    <script type="module" src="dash_dashboard.js"></script>
</body>
</html>
