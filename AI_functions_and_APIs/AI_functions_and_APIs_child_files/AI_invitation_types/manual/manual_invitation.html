<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EventEase - Custom Manual Creator</title>
    
    <link rel="icon" type="image/png" href="../../../../ee_logo_bgremove.png">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;700&family=Poppins:wght@400;600&family=Tiro+Devanagari+Hindi&family=Pacifico&family=Oswald:wght@400;600&family=Lavishly+Yours&family=Imperial+Script&family=Birthstone&family=Yesteryear&family=Sacramento&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="manual_invitation.css">
</head>
<body>

   <header class="app-header">
       <div class="header-left">
           <div class="logo">
               <span class="logo-icon">✨</span>
               <span class="logo-text">EventEase</span>
           </div>
       </div>

      <div class="header-center">
           <nav class="nav-links">
               <a href="../../../../dashboard.html" class="nav-link">Dashboard</a>
               <a href="../../../AI_plan.html" class="nav-link">AI Panel</a>
               <a href="../../AI_invitation_generator.html" class="nav-link">AI Invitation Generator</a>
           </nav>
       </div>

       <div class="header-right">
           <button class="theme-toggle" id="themeToggleBtn">
               <span class="icon">🌞</span>
           </button>
       </div>
   </header>

   <div class="tools-bar">
       <button class="menu-btn" id="sidebarToggleBtn" >
           <span style="font-size: 18px;">☰</span> 
           <span class="desktop-text">Tools & Elements</span>
       </button>
   </div>

   <div class="main-workspace">
       <div class="canvas-wrapper">
           <canvas id="myCanvas" width="500" height="700"></canvas>
       </div>
   </div>

   <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

   <div class="sidebar" id="sidebar">
       <div class="sidebar-header">
           <h3>🎨 Creative Tools</h3>
           <button class="close-btn" onclick="toggleSidebar()">×</button>
       </div>

       <div class="controls-inner">
           <div class="section" style="background: #e8f4f8; border-color: #b6d4fe;">
               <button class="tool-btn btn-success" onclick="downloadCard()">💾 Download Invitation</button>
               <div class="btn-group">
                   <button class="tool-btn btn-danger" onclick="deleteSelected()">🗑️ Delete Selected</button>
                   <button class="tool-btn btn-danger" style="background-color: #ff9800;" onclick="clearCanvas()">⚠️ Clear All</button>
               </div>
           </div>

           <div class="section">
               <div class="section-title">1. Background</div>
               <label>Solid Color:</label>
               <input type="color" value="#ffffff" onchange="changeSolidBackground(this.value)">
               
               <hr style="border: 0.5px solid #ddd; margin: 10px 0;">
               
               <label>Gradient Background:</label>
               <div class="flex-row">
                   <div><label>Color 1</label><input type="color" id="bgGrad1" value="#ff9a9e"></div>
                   <div><label>Color 2</label><input type="color" id="bgGrad2" value="#fecfef"></div>
               </div>
               <label>Gradient Type:</label>
               <select id="bgGradType">
                   <option value="linear">Linear (Straight)</option>
                   <option value="radial">Radial (Circular)</option>
               </select>
               <button class="tool-btn btn-secondary" style="width: 100%; margin-top: 10px;" onclick="applyCanvasGradient()">Apply Gradient Background</button>
               
               <hr style="border: 0.5px solid #ddd; margin: 10px 0;">
               <label>Upload BG Image:</label>
               <input type="file" accept="image/*" onchange="uploadBackgroundImage(event)">
           </div>

           <div class="section">
               <div class="section-title">2. Card Border</div>
               
               <label>Border Style:</label>
               <select id="borderStyle" onchange="updateBorder()">
                   <option value="solid">Solid Line</option>
                   <option value="dashed">Dashed Line</option>
                   <option value="dotted">Dotted Line</option>
               </select>

               <div class="flex-row">
                   <div>
                       <label>Color:</label>
                       <input type="color" id="borderColor" value="#d4af37" onchange="updateBorder()">
                   </div>
                   <div>
                       <label>Thickness: <span id="borderWidthVal">0</span>px</label>
                       <input type="range" id="borderWidth" min="0" max="30" value="0" oninput="updateBorder()">
                   </div>
               </div>
           </div>

           <div class="section">
               <div class="section-title">3. Text Styling</div>
               <button class="tool-btn" onclick="addText()" style="width: 100%; margin-bottom: 10px; background-color: #28a745;">+ Add New Text</button>
               
               <label>Change Font:</label>
               <select onchange="changeFontFamily(this.value)">
                   <option value="Arial">Arial (Default)</option>
                   <option value="'Poppins', sans-serif">Poppins (Modern)</option>
                   <option value="'Mukta', sans-serif">Mukta (Hindi/English)</option>
                   <option value="'Oswald', sans-serif" class="f-oswald">Oswald (Bold/Clean)</option>
                   <option value="'Pacifico', cursive" class="f-pacifico">Pacifico (Thick Brush)</option>
                   <option value="'Lavishly Yours', cursive" class="f-lavishly">Lavishly Yours (Elegant)</option>
                   <option value="'Imperial Script', cursive" class="f-imperial">Imperial Script (Formal)</option>
                   <option value="'Birthstone', cursive" class="f-birthstone">Birthstone (Playful)</option>
                   <option value="'Yesteryear', cursive" class="f-yesteryear">Yesteryear (Vintage)</option>
                   <option value="'Sacramento', cursive" class="f-sacramento">Sacramento (Thin Script)</option>
                   <option value="Times New Roman">Times New Roman</option>
               </select>

               <div style="background: #e8eaf6; padding: 10px; border-radius: 6px; margin-top: 10px;">
                   <label style="margin-top: 0; color: #3f51b5;">Solid Text Color:</label>
                   <input type="color" value="#333333" id="textColorPicker" onchange="changeSolidTextColor(this.value)">
               </div>
               
               <label style="color: #d4af37; font-weight: bold; margin-top: 10px;">✨ Premium Text Effects:</label>
               <select id="metallicType" onchange="applyMetallicFont(this.value)">
                   <option value="">-- Apply Metallic Effect --</option>
                   <option value="gold">🏆 Gold Metallic</option>
                   <option value="silver">🥈 Silver Metallic</option>
                   <option value="bronze">🥉 Bronze Metallic</option>
               </select>
               <div class="btn-group" style="margin-top: 15px;">
                   <button class="tool-btn btn-secondary" onclick="toggleTextStyle('fontWeight', 'bold', 'normal')"><b>B</b></button>
                   <button class="tool-btn btn-secondary" onclick="toggleTextStyle('fontStyle', 'italic', 'normal')"><i>I</i></button>
                   <button class="tool-btn btn-secondary" onclick="changeTextAlign('left')">Left</button>
                   <button class="tool-btn btn-secondary" onclick="changeTextAlign('center')">Center</button>
                   <button class="tool-btn btn-secondary" onclick="changeTextAlign('right')">Right</button>
               </div>
           </div>

           <div class="section">
               <div class="section-title">4. Stickers & Photos</div>
               <label>Upload Image:</label>
               <input type="file" accept="image/*" multiple onchange="uploadImage(event)">
               
               <label>Layer Control (Selected Item):</label>
               <div class="btn-group">
                   <button class="tool-btn btn-secondary" onclick="bringForward()">⬆️ Bring Forward</button>
                   <button class="tool-btn btn-secondary" onclick="sendBackward()">⬇️ Send Backward</button>
               </div>
           </div>

           <div class="section" style="background-color: #fff9e6; border-color: #ffe699;">
               <div class="section-title" style="color: #d49a00; border-bottom-color: #d49a00;">5. Image Formatting</div>
               <p style="font-size: 11px; color: #777; margin: 0 0 10px 0;">Select an image on the canvas to edit its borders and corners.</p>
               
               <label>Image Border Color:</label>
               <input type="color" id="imgBorderColor" value="#000000" onchange="updateSelectedImage()">

               <div class="flex-row">
                   <div>
                       <label>Border: <span id="imgBorderWidthVal">0</span>px</label>
                       <input type="range" id="imgBorderWidth" min="0" max="20" value="0" oninput="updateSelectedImage()">
                   </div>
                   <div>
                       <label>Radius: <span id="imgBorderRadiusVal">0</span>px</label>
                       <input type="range" id="imgBorderRadius" min="0" max="150" value="0" oninput="updateSelectedImage()">
                   </div>
               </div>
           </div>

           <div class="section">
               <div class="section-title">6. Insert Shapes</div>
               <label>Shape Color:</label>
               <input type="color" id="shapeColor" value="#007bff">
               
               <label style="margin-top: 10px;">Outline Shapes (Border Only):</label>
               <div class="btn-group">
                   <button class="tool-btn btn-secondary" onclick="addShape('rect', false)">Square</button>
                   <button class="tool-btn btn-secondary" onclick="addShape('circle', false)">Circle</button>
                   <button class="tool-btn btn-secondary" onclick="addShape('triangle', false)">Triangle</button>
               </div>

               <label style="margin-top: 10px;">Filled Shapes:</label>
               <div class="btn-group">
                   <button class="tool-btn btn-secondary" onclick="addShape('rect', true)">Square</button>
                   <button class="tool-btn btn-secondary" onclick="addShape('circle', true)">Circle</button>
                   <button class="tool-btn btn-secondary" onclick="addShape('triangle', true)">Triangle</button>
               </div>
           </div>
       </div>
   </div>

   <script src="manual_invitation.js"></script>
</body>
</html>
