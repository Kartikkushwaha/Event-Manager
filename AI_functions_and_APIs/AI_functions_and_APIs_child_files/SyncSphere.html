<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EventEase - Workspace</title>
    <style>
        /* Base styles - MOBILE KEYBOARD FIX */
        body, html { 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            height: 100%; /* Fallback */
            height: 100dvh; /* Dynamic viewport height */
            background-color: #d1d7db; 
            overflow: hidden; 
            position: fixed; /* Prevents the body from scrolling off-screen */
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%;
        }
        * { box-sizing: border-box; }

        /* Main Layout */
        .app-container { 
            display: flex; 
            flex-direction: row; 
            height: 100%; /* Inherits the fixed height from body */
            width: 100%; 
            max-width: 1600px; 
            margin: 0 auto; 
            background: #fff; 
            box-shadow: 0 1px 1px 0 rgba(0,0,0,0.06); 
            position: relative; 
        }
        
        /* Sidebar */
        .sidebar { width: 30%; min-width: 280px; background-color: #ffffff; display: flex; flex-direction: column; border-right: 1px solid #e1e1e1; z-index: 1000; transition: left 0.3s ease; }
        .sidebar-header { background-color: #f0f2f5; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e1e1e1; }
        .sidebar-header h3 { margin: 0; font-size: 15px; color: #41525d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 50%; }
        
        .contact-list { flex: 1; overflow-y: auto; background: #fff; }
        .community-item { padding: 15px; border-bottom: 1px solid #f2f2f2; cursor: pointer; display: flex; align-items: center; }
        .community-item:hover, .community-item.active { background-color: #f5f6f6; }
        .community-avatar { width: 40px; height: 40px; border-radius: 50%; background: #2563eb; color: white; display: flex; justify-content: center; align-items: center; font-weight: bold; margin-right: 15px; text-transform: uppercase; flex-shrink: 0; }
        
        /* Chat Window */
        .chat-window { flex: 1; display: flex; flex-direction: column; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-color: #efeae2; height: 100%; }
        .chat-header { background-color: #f0f2f5; padding: 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e1e1e1; }
        .chat-header-left { display: flex; align-items: center; }
        .chat-header-title { margin: 0; font-size: 16px; color: #111b21; display: inline-block; }
        .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
        
        /* Message Area */
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }
        .message { max-width: 65%; padding: 10px 15px; margin-bottom: 10px; border-radius: 7.5px; font-size: 14.5px; position: relative; line-height: 1.4; word-wrap: break-word; }
        .message .sender-name { font-size: 12px; font-weight: bold; margin-bottom: 3px; color: #1f2937; }
        .message.sent { align-self: flex-end; background-color: #d9fdd3; border-top-right-radius: 0; }
        .message.received { align-self: flex-start; background-color: #ffffff; border-top-left-radius: 0; }
        .message .time { font-size: 11px; color: #667781; text-align: right; margin-top: 4px; display: block; }
        
        /* Message Delete Button */
        .delete-msg-btn { position: absolute; top: 5px; right: 5px; font-size: 11px; cursor: pointer; color: #dc2626; background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 4px; padding: 2px 5px; display: none; }
        .message:hover .delete-msg-btn { display: block; }

        /* Input Area */
        .chat-input-container { background-color: #f0f2f5; padding: 10px 15px; display: flex; align-items: center; }
        
        /* Attachment Button */
        .attach-btn { background: transparent; border: none; font-size: 22px; cursor: pointer; color: #54656f; padding: 5px 10px 5px 0; display: flex; align-items: center; justify-content: center; }
        .attach-btn:hover { color: #111b21; }

        .chat-input { flex: 1; padding: 12px 15px; border: none; border-radius: 8px; font-size: 15px; outline: none; }
        .send-btn { background-color: #2563eb; color: white; border: none; padding: 12px 20px; margin-left: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; flex-shrink: 0; }
        .send-btn:hover { background-color: #1d4ed8; }

        /* Buttons & Badges */
        .action-btn { background-color: #10b981; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; white-space: nowrap; }
        .action-btn:hover { background-color: #059669; }
        .action-btn.outline { background-color: transparent; color: #2563eb; border: 1px solid #2563eb; }
        .action-btn.outline:hover { background-color: #eff6ff; }
        .btn-danger { color: #dc2626 !important; border-color: #dc2626 !important; }
        .btn-danger:hover { background-color: #fef2f2 !important; }
        .admin-badge { color: #dc2626; font-weight: bold; font-size: 10px; margin-left: 5px; vertical-align: super; }
        
        /* Modal List Buttons (NEW STYLES ADDED HERE) */
        .remove-member-btn { background-color: #fef2f2; color: #dc2626; border: 1px solid #f87171; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; float: right; margin-top: -15px;}
        .remove-member-btn:hover { background-color: #fee2e2; }
        
        .btn-approve { background-color: #d9fdd3; color: #166534; border: 1px solid #22c55e; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; float: right; margin-top: -15px; margin-right: 5px;}
        .btn-approve:hover { background-color: #bbf7d0; }
        
        .btn-reject { background-color: #fef2f2; color: #dc2626; border: 1px solid #f87171; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; float: right; margin-top: -15px; }
        .btn-reject:hover { background-color: #fee2e2; }

        .pending-heading { font-size: 14px; font-weight: bold; color: #d97706; margin-top: 15px; margin-bottom: 5px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .pending-item { background-color: #fffbeb; }

        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 10px; }
        .modal-overlay.hidden { display: none; }
        .modal-content { background: #fff; padding: 25px; border-radius: 8px; width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e7eb; padding-bottom: 10px; margin-bottom: 5px; }
        .modal-header h2 { margin: 0; font-size: 18px; color: #111b21; }
        .close-modal { cursor: pointer; font-size: 24px; font-weight: bold; color: #6b7280; border: none; background: transparent; }
        .modal-content label { font-size: 14px; font-weight: 500; color: #374151; }
        .modal-content input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; outline: none; }
        .full-btn { background: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%; }
        .member-list-item { padding: 10px; border-bottom: 1px solid #eee; font-size: 14px; position: relative; }
        .member-list-item span.email { color: #6b7280; font-size: 12px; display: block; }
        .hidden { display: none !important; }

        /* Mobile specific elements */
        .mobile-menu-btn { display: none; background: transparent; border: none; font-size: 24px; cursor: pointer; margin-right: 15px; color: #41525d; padding: 0; }
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 900; display: none; }
        .sidebar-overlay.active { display: block; }

        /* MOBILE RESPONSIVENESS */
        @media (max-width: 768px) {
            .mobile-menu-btn { display: inline-block; }
            .sidebar { position: absolute; left: -100%; top: 0; height: 100dvh; width: 85%; max-width: 350px; box-shadow: 2px 0 10px rgba(0,0,0,0.2); }
            .sidebar.open { left: 0; }
            .chat-window { width: 100%; }
            .message { max-width: 85%; font-size: 13.5px; }
            .action-btn { padding: 5px 8px; font-size: 11px; }
            .chat-header-title { font-size: 15px; }
            .delete-msg-btn { padding: 4px 8px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3 id="user-greeting">Loading...</h3>
                <div style="display: flex; gap: 5px;">
                    <button class="action-btn outline" id="btn-join-community" style="padding: 6px 10px; font-size: 12px;">Join</button>
                    <button class="action-btn" id="btn-create-community" style="padding: 6px 10px; font-size: 12px;">+ New</button>
                </div>
            </div>
            <div class="contact-list" id="community-list"></div>
        </div>

        <div class="chat-window">
            <div class="chat-header">
                <div class="chat-header-left">
                    <button class="mobile-menu-btn" id="mobile-menu-btn">&#9776;</button>
                    <h2 id="chat-title" class="chat-header-title">Select a Community</h2>
                </div>
                <div class="header-actions hidden" id="chat-actions">
                    <button class="action-btn outline btn-danger hidden" id="btn-delete-comm">Delete</button>
                    <button class="action-btn outline" id="btn-view-members">Members</button>
                    <button class="action-btn" id="btn-add-member">+ User</button>
                </div>
            </div>
            
            <div class="chat-messages" id="chat-messages">
                <div style="text-align: center; color: #667781; margin-top: 20vh;">
                    Create, Join, or Select a community from the list to start chatting.
                </div>
            </div>

            <div class="chat-input-container hidden" id="chat-input-area">
                <input type="file" id="file-attachment" style="display: none;" accept="image/*,video/*,audio/*,application/*">
                <button class="attach-btn" id="attach-btn" title="Attach a file">📎</button>
                
                <input type="text" id="message-input" class="chat-input" placeholder="Type a message..." autocomplete="off">
                <button id="send-btn" class="send-btn">Send</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay hidden" id="modal-create">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create Community</h2>
                <button class="close-modal" onclick="closeModals()">&times;</button>
            </div>
            <div>
                <label>Community Name</label>
                <input type="text" id="create-comm-name" placeholder="e.g. Design Team">
            </div>
            <div>
                <label>Custom Referral Code</label>
                <input type="text" id="create-comm-code" placeholder="e.g. DESIGN-26">
            </div>
            <button class="full-btn" id="submit-create-comm">Create</button>
        </div>
    </div>

    <div class="modal-overlay hidden" id="modal-join">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Join a Community</h2>
                <button class="close-modal" onclick="closeModals()">&times;</button>
            </div>
            <div>
                <label>Enter Referral Code</label>
                <input type="text" id="join-comm-code" placeholder="e.g. MARKETING-101">
            </div>
            <button class="full-btn" id="submit-join-comm">Join Community</button>
        </div>
    </div>

    <div class="modal-overlay hidden" id="modal-add">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add Member</h2>
                <button class="close-modal" onclick="closeModals()">&times;</button>
            </div>
            <div>
                <label>Member's Gmail Address</label>
                <input type="email" id="add-member-email" placeholder="user@gmail.com">
            </div>
            <button class="full-btn" id="submit-add-member">Add to Community</button>
        </div>
    </div>

    <div class="modal-overlay hidden" id="modal-members">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Community Members</h2>
                <button class="close-modal" onclick="closeModals()">&times;</button>
            </div>
            <div id="member-list-container" style="max-height: 300px; overflow-y: auto;">
                </div>
        </div>
    </div>

    <script type="module" src="SyncSphere.js">
        

    </script>
</body>
</html>
