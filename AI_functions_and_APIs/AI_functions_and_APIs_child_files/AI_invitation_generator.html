<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
  :root{

    --bg:#f4f7fc;

    --navbar:white;

    --card:rgb(190, 237, 240);

    --text:#333;

    --secondaryText:gray;

    --shadow:0 5px 15px rgba(0,0,0,0.08);
    

}

.dark-mode{

    --bg:#0f172a;

    --navbar:#1e293b;

    --card:#334155;

    --text:#f8fafc;

    --secondaryText:#cbd5e1;

    --shadow:0 5px 20px rgba(0,0,0,0.4);

}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:var(--bg);
    transition:.3s;
}

.navbar {
    background: var(--navbar);
    padding: 18px 50px;
    display: flex;
    border-radius: 12px; 
    justify-content: space-between;
    align-items: center;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    z-index: 100;
    margin-top: 20px;
    margin-left: 20px;
    margin-right: 20px;
}

.logo {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px; 
    color: #2563eb;
}

.logo span {
    color: var(--accent);
}

.nav-links {
    display: flex;
    gap: 30px;
}

.nav-links a {
    text-decoration: none;
    color: var(--secondaryText);
    font-weight: 500;
    font-size: 15px;
    transition: color 0.2s ease;
}

.nav-links a:hover {
    color: var(--text);
}

/* theme button toggle */
#themeToggle {
    background: var(--text);
    color: var(--bgCore);
    border: none;
    padding: 10px 18px;
    border-radius: 20px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    margin-right: 10px;
    transition: transform 0.2s ease, opacity 0.2s ease;
}

#themeToggle:hover {
    opacity: 0.85;
    transform: scale(1.02);
}







@media(max-width:900px){

    .guest-head{
        display:none;
    }

    .guest-row{
        grid-template-columns:1fr;
    }

    .deleteBtn{
        width:100%;
    }

}

@media(max-width:768px){

    .navbar{
        flex-direction:column;
        gap:15px;
    }

    /* .stats-container{
        grid-template-columns:1fr;
    } */

    .nav-links{
        flex-wrap:wrap;
        justify-content:center;
    }
}


  
</style>


</head>
<body>

     <nav class="navbar">

        <div class="logo">
            ✨ EventEase
        </div>

        <div class="nav-links">
        
           <a id="dashboard" href="../../dashboard.html">Dashboard</a>
            
            <a id="AIpanel"  href="../AI_plan.html"> AI Panel </a>
           
           
            
 
        </div>
        <button id="themeToggle">
    🌙
</button>

    

    </nav>



   
  
<script type="module" src="AI_invitation_generator.js"></script>
</body>
</html>
