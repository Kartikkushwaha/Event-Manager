<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
  :root{

    --bg:#f4f7fc;

    --navbar:white;

    --card:rgb(190, 237, 240);

    --text:#333;

    --secondaryText:gray;

    --shadow:0 5px 15px rgba(0,0,0,0.08);
    

}

.dark-mode{

    --bg:#0f172a;

    --navbar:#1e293b;

    --card:#334155;

    --text:#f8fafc;

    --secondaryText:#cbd5e1;

    --shadow:0 5px 20px rgba(0,0,0,0.4);

}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:var(--bg);
    transition:.3s;
}

/* Navbar */
.navbar {
    background: var(--navbar);
    padding: 18px 50px;
    display: flex;
    border-radius: 12px; 
    justify-content: space-between;
    align-items: center;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    z-index: 100;
    margin-top: 20px;
    margin-left: 20px;
    margin-right: 20px;
}


.logo {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px; 
    color: #2563eb;
}

.logo span {
    color: var(--accent);
}

.nav-links {
    display: flex;
    gap: 30px;
}

.nav-links a {
    text-decoration: none;
    color: var(--secondaryText);
    font-weight: 500;
    font-size: 15px;
    transition: color 0.2s ease;
}

.nav-links a:hover {
    color: var(--text);
}

/* theme button toggle */
#themeToggle {
    background: var(--text);
    color: var(--bgCore);
    border: none;
    padding: 10px 18px;
    border-radius: 20px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    margin-right: 10px;
    transition: transform 0.2s ease, opacity 0.2s ease;
}

#themeToggle:hover {
    opacity: 0.85;
    transform: scale(1.02);
}


/* guest panel */






/* guest panel */


.tag{
    display:inline-block;
    background:#dbeafe;
    color:#2563eb;
    padding:8px 15px;
    border-radius:30px;
    margin:40px;
    font-size:14px;
    font-weight:600;
    
}

.guest-panel{
    width:90%;
    margin:30px auto;
    background:var(--card);
    padding:20px;
    border-radius:15px;
    box-shadow:var(--shadow);
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.panel-header h2{
    color:var(--text);
}

#addGuestBtn{
    background:#2563eb;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
}

/* .guest-head,
.guest-row{
    display:grid;
    grid-template-columns:
    80px 1fr 1fr 1fr 100px;
    gap:10px;
    margin-bottom:10px;
} */

.guest-head,
.guest-row{
    display:grid;
    grid-template-columns:
    60px
    minmax(150px,1fr)
    minmax(150px,1fr)
    minmax(120px,1fr)
    80px;

    gap:10px;
    align-items:center;
}


.guest-head{
    font-weight:bold;
    color:var(--text);
}

/* .guest-row input{
    padding:10px;
    border:1px solid #ddd;
    border-radius:8px;
} */
.guest-row{
    margin: 10px
}
.guest-row input{
    width:100%;
    min-width:0;
    padding:10px;
    border:1px solid #ddd;
    border-radius:8px;
}

.serial-box{
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text);
}

.deleteBtn{
    background:#ef4444;
    width: 100%;
    height:40px;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.guest-footer{
    margin-top:15px;
    color:var(--text);
}

@media(max-width:900px){

    .guest-head{
        display:none;
    }

    .guest-row{
        grid-template-columns:1fr;
    }

    .deleteBtn{
        width:100%;
    }

}

@media(max-width:768px){

    .navbar{
        flex-direction:column;
        gap:15px;
    }

    /* .stats-container{
        grid-template-columns:1fr;
    } */

    .nav-links{
        flex-wrap:wrap;
        justify-content:center;
    }
}

.panel-buttons{
    display:flex;
    gap:10px;
}

#saveGuestBtn{
    background:#16a34a;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    transition:.25s;
}

#saveGuestBtn:hover{
    background:#15803d;
    transform:translateY(-2px);
}
  
</style>


</head>
<body>

     <nav class="navbar">

        <div class="logo">
            ✨ EventEase
        </div>

        <div class="nav-links">
        
           <a id="dashboard" href="../../dashboard.html">Dashboard</a>
            
            <a id="AIpanel"  href="../AI_plan.html"> AI Panel </a>
           
           
            
 
        </div>
        <button id="themeToggle">
    🌙
</button>

    

    </nav>


<!-- guest panel -->

<div class="guest-panel">

    <div class="panel-header">
    <h2>🤵 Guest List Manager</h2>

    <div class="panel-buttons">
        <button id="saveGuestBtn">💾 Save</button>
        <button id="addGuestBtn">+ Add Guest</button>
    </div>
</div>

    <div class="guest-head">
        <div>S.No.</div>
        <div>Name *</div>
        <div>Address</div>
        <div>Phone</div>
        <!-- <div>Action</div> -->
    </div>
    
<div class="guest-footer">
        <span id="guestCount">
            Total Guests: 0
        </span>
    </div>

    <div id="guestContainer"></div>

    

</div>
  
<script type="module" src="guest_list_manager.js"></script>
</body>
</html>
