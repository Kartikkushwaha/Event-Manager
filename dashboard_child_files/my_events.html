<!DOCTYPE html>
<html>

<head>

<title>My Events</title>
<style>

  /* day/night mode */

      :root{

    --bg:#f4f7fc;

    --navbar:white;

    --card:white;

    --text:#333;

    --secondaryText:gray;

    --shadow:0 5px 15px rgba(0,0,0,0.08);
      }

    .dark-mode{

    --bg:#0f172a;

    --navbar:#1e293b;

    --card:#334155;

    --text:#f8fafc;

    --secondaryText:#cbd5e1;

    --shadow:0 5px 20px rgba(0,0,0,0.4);

    }

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
    padding:40px;
}

 nav {
            width: 100%;
            border-radius: 8px;
            background:var(--navbar);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;

        }

        nav .logo {
            font-size: 28px;
            font-weight: bold;
            color: #2563eb;
        }

        nav .theme-btn {
            background: #2563eb;
            border: 1px solid #ccc;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }

        nav .theme-btn:hover {
            background-color: #f0f0f0;
        }
        

h1{
    margin-bottom:30px;
}
#updateBtn{
    margin-bottom:20px;
    padding:12px 25px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-weight:bold;
}
    
#goToDash{
    margin-bottom:20px;
    padding:12px 25px;
    border:none;
    border-radius:8px;
    background:#092e5f;
    color:white;
    cursor:pointer;
    font-weight:bold;
}
    #crtMreEvent{
    margin-bottom:20px;
    padding:12px 25px;
    border:none;
    border-radius:8px;
    background:#092e5f;
    color:white;
    cursor:pointer;
    font-weight:bold;
}
#eventsContainer{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.event-card{
    background:var(--card);
    padding:20px;
    border-radius:15px;
    box-shadow:
    0 5px 15px rgba(0,0,0,0.1);
}

.event-card p{
    margin:8px 0;
}
    
.deleteBtn{
    margin-top:15px;
    padding:10px 15px;
    border:none;
    background:red;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

</style>

</head>

<body>
    <nav>
        <div class="logo">✨ EventEase</div>
        <button class="theme-btn" id="themeToggle">🌙</button>
    </nav>

<h1>My Events</h1>
    <button id="updateBtn">
    Update Changes
</button>

    <button id="goToDash">
    Go to Dashboard
</button>
    <button id="crtMreEvent">
   Create more Events
</button>

<div id="eventsContainer"></div>

<script type="module"
src="my_events.js">
</script>

</body>

</html>
